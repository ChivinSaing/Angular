<div class="mx-auto flex max-w-6xl flex-col gap-6 px-4 py-8 lg:flex-row lg:items-start lg:gap-4">
  <section class="min-w-0 flex-1 max-w-3xl">
    <a
      routerLink="/home"
      class="text-sm font-medium text-slate-600 underline-offset-4 hover:text-slate-900 hover:underline"
    >
      ← Back to menu
    </a>

    @if (loading()) {
      <p class="mt-8 text-sm text-slate-500">Loading…</p>
    } @else if (error(); as err) {
      <p class="mt-8 text-sm text-red-600" role="alert">{{ err }}</p>
    } @else if (drink(); as d) {
      <div class="mt-8 grid gap-8 md:grid-cols-2 md:items-start">
        <div class="detail-media rounded-2xl border border-slate-200 bg-white p-4">
          <img
            class="mx-auto block w-full max-w-md rounded-xl"
            [src]="d.image_url || fallbackImage"
            [alt]="d.name"
          />
        </div>
        <div class="space-y-4">
          <div>
            <p class="text-sm text-slate-500">{{ d.category.name }}</p>
            <h1 class="text-2xl font-bold text-slate-900">{{ d.name }}</h1>
          </div>
          <p class="text-xl font-semibold text-slate-900">${{ d.price }}</p>
          <div class="space-y-2 text-sm text-slate-700">
            <p><span class="font-medium text-slate-900">Sizes:</span> {{ d.size }}</p>
            <p><span class="font-medium text-slate-900">Sugar options:</span> {{ d.sugar }}</p>
            <p>
              <span class="font-medium text-slate-900">In stock:</span>
              {{ d.stock_qty }}
            </p>
          </div>
        </div>
      </div>
      <div class="mt-8 max-w-sm">
        <app-card-box [item]="cardItemFor(d)" />
      </div>
    }
  </section>
  <app-order-cart-panel />
</div>
